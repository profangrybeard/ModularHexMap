; Project-default editor settings (checked in). Seeds a fresh Saved/Config on first launch.
; Auto-reimport: watch the exported hex-tile .glb sources so changed tiles offer to reimport.
;  - Wildcard "HexTiles/Source/*.glb" makes the monitor notice tile exports from the Blender pipeline.
;  - bAutoCreateAssets=False: a NEW .glb does NOT auto-create a junk asset in the Source folder;
;    first imports stay deliberate. Only EXISTING tiles reimport when their .glb changes.
;  - bPromptBeforeAutoImporting=True: UE asks before reimporting (not silent).
; For a deterministic full-kit refresh after "Build Enabled", use Tools > Reimport Hex Tiles
; (Content/Python/reimport_hextiles.py) instead of relying on the watcher.

[/Script/UnrealEd.EditorLoadingSavingSettings]
bMonitorContentDirectories=True
AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*"),(Wildcard="_project/HexTiles/Source/*.glb")))
bAutoCreateAssets=False
bAutoDeleteAssets=False
bDetectChangesOnStartup=True
bPromptBeforeAutoImporting=True
